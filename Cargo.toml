[package]
name = "crit"
version = "0.1.0"
edition = "2024"
description = "A worktree-first terminal for OMP and OpenCode"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
jsonc-parser = { version = "0.29", features = ["serde"] }
libc = "0.2"
memchr = "2"
parking_lot = "0.12"
portable-pty = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
semver = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
unicode-segmentation = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
toml = "0.8"
vt100 = "0.16"

[patch.crates-io]
vt100 = { path = "vendor/vt100" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Managed by Crit. Do not edit.
# Installed as kitty/crit.conf; include it after other key mappings.
# Only the outer Kitty window running Crit sets these user variables.
# F12 stays routed to Crit in BOTH modes; Crit changes crit_keys persistently.
map --when-focus-on var:crit_active=1 f12 send_text all \x1b[24~

# Copy native Shift+drag selections first, then let Crit copy its own selection.
# Native paste still reaches Crit as terminal paste, including over SSH.
map --when-focus-on var:crit_active=1 ctrl+shift+c combine : copy_to_clipboard : send_text all \x1b[67;6u
map --when-focus-on var:crit_active=1 ctrl+shift+v paste_from_clipboard
map --when-focus-on var:crit_active=1 shift+insert paste_from_selection

# Crit mode: standard/CSI-u input preserves Ctrl+Shift without protocol negotiation.
# Native mode: these conditions stop matching, restoring the existing Kitty maps.
# Font-size shortcuts are deliberately not mapped here.
map --when-focus-on var:crit_keys=crit ctrl+shift+t send_text all \x1b[116;6u
map --when-focus-on var:crit_keys=crit ctrl+shift+q send_text all \x1b[113;6u
map --when-focus-on var:crit_keys=crit ctrl+shift+enter send_text all \x1b[13;6u
map --when-focus-on var:crit_keys=crit ctrl+shift+w send_text all \x1b[119;6u

map --when-focus-on var:crit_keys=crit ctrl+shift+right send_text all \x1b[1;6C
map --when-focus-on var:crit_keys=crit ctrl+tab send_text all \x1b[9;5u
map --when-focus-on var:crit_keys=crit ctrl+shift+left send_text all \x1b[1;6D
map --when-focus-on var:crit_keys=crit ctrl+shift+tab send_text all \x1b[9;6u
map --when-focus-on var:crit_keys=crit ctrl+shift+] send_text all \x1b[93;6u
map --when-focus-on var:crit_keys=crit ctrl+shift+[ send_text all \x1b[91;6u

map --when-focus-on var:crit_keys=crit ctrl+shift+, send_text all \x1b[44;6u
map --when-focus-on var:crit_keys=crit ctrl+shift+. send_text all \x1b[46;6u
map --when-focus-on var:crit_keys=crit ctrl+shift+l send_text all \x1b[108;6u

